# TLS edge for soc-core (PR 15). Inside the container: HTTPS on 8443 (published as 443) and HTTP on 8080 (published as 80,
# redirects to HTTPS). Certificates come from ./nginx/tls and are never committed (see README).

server {
    listen 8080;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 8443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1h;
    ssl_session_tickets off;

    # Matches the application's own cap (INGEST_MAX_BODY_BYTES, 1 MB). Larger bodies get 413 here.
    client_max_body_size 1m;
    client_body_timeout 15s;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    # 'unsafe-inline' is needed while static/index.html uses inline style and event-handler attributes.
    # Remove it when the page moves to external scripts and stylesheets.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'" always;

    location / {
        proxy_pass http://soc-core:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # The app trusts one proxy hop (ProxyFix in app.py). Appending keeps the real client address last.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }
}
